<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nerd Arena | App Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <script src="theme.js"></script> 
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <a href="index.html"><div class="logo"><i class="ph-fill ph-code"></i> <span>Nerd Arena</span></div></a>
        <div class="header-actions">
            <div class="user-profile dropdown-container" id="nav-user-container">
                <div class="avatar-text bg-primary" id="nav-avatar">...</div>
                <div class="dropdown-menu" id="nav-dropdown">
                    <a href="profile.html"><i class="ri-user-line"></i> My Profile</a>
                    <a href="index.html"><i class="ri-home-line"></i> Home</a>
                    <a href="settings-account.html"><i class="ri-user-settings-line"></i> Account Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="logout-btn" class="text-danger"><i class="ri-logout-box-r-line"></i> Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <main class="profile-scroll-wrapper">
        <div class="settings-container" style="max-width: 800px;">
            <div class="card settings-card animate-fade-in">
                <h2><i class="ri-equalizer-line"></i> App Preferences</h2>
                <p style="color: var(--text-muted); margin-top: 5px;">Customize your viewing experience and app behavior.</p>

                <div class="settings-section-title">Appearance</div>
                <div class="theme-selector-grid" id="theme-selector">
                    <div class="theme-card active" data-theme-val="light">
                        <i class="ri-sun-line"></i>
                        <span>Light Mode</span>
                    </div>
                    <div class="theme-card" data-theme-val="dark">
                        <i class="ri-moon-clear-line"></i>
                        <span>Dark Mode</span>
                    </div>
                    <div class="theme-card" data-theme-val="system">
                        <i class="ri-computer-line"></i>
                        <span>System Default</span>
                    </div>
                </div>

                <div class="settings-section-title">Accent Color</div>
                <div class="accent-grid" id="accent-selector">
                    <div class="accent-swatch active" style="background: #6366f1;" data-color="#6366f1" data-hover="#4f46e5"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #3b82f6;" data-color="#3b82f6" data-hover="#2563EB"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #10b981;" data-color="#10b981" data-hover="#059669"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #f43f5e;" data-color="#f43f5e" data-hover="#e11d48"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #f59e0b;" data-color="#f59e0b" data-hover="#d97706"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #0ea5e9;" data-color="#0ea5e9" data-hover="#0284c7"><i class="ri-check-line"></i></div>
                    <div class="accent-swatch" style="background: #8b5cf6;" data-color="#8b5cf6" data-hover="#7c3aed"><i class="ri-check-line"></i></div>
                </div>

                <div class="settings-section-title" style="margin-top: 35px;">Application</div>
                <div class="settings-list">
                    <div class="settings-list-item">
                        <div class="item-info"><i class="ri-notification-3-line"></i> Push Notifications</div>
                        <div class="item-action toggle-switch active" onclick="this.classList.toggle('active')"></div>
                    </div>
                    <div class="settings-list-item">
                        <div class="item-info"><i class="ri-volume-up-line"></i> Interface Sounds</div>
                        <div class="item-action toggle-switch" onclick="this.classList.toggle('active')"></div>
                    </div>
                    <div class="settings-list-item" onclick="window.location.href='settings-account.html'">
                        <div class="item-info"><i class="ri-shield-user-line"></i> Edit Profile & Account</div>
                        <div class="item-action"><i class="ri-arrow-right-s-line"></i></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="pload.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
