<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repo Fetcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background-color: #f6f8fa; }
        .search-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        input { width: 75%; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 20px; border: none; background-color: #2ea44f; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        button:hover { background-color: #2c974b; }
        #repo-list { margin-top: 30px; width: 100%; max-width: 600px; list-style: none; padding: 0; }
        .repo-card { background: white; margin-bottom: 15px; padding: 20px; border-radius: 8px; border: 1px solid #d0d7de; transition: transform 0.2s; }
        .repo-card:hover { transform: translateY(-3px); border-color: #0969da; }
        .repo-card a { text-decoration: none; color: #0969da; font-size: 1.2em; font-weight: 600; }
        .repo-card p { color: #57606a; margin: 8px 0; font-size: 0.95em; }
        .repo-stats { font-size: 0.85em; color: #57606a; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>Find Repositories</h2>
        <input type="text" id="username" placeholder="GitHub username (e.g. octocat)">
        <button onclick="fetchRepos()">Search</button>
    </div>

    <ul id="repo-list"></ul>

    <script>
        async function fetchRepos() {
            const username = document.getElementById('username').value;
            const repoList = document.getElementById('repo-list');
            
            if (!username) {
                alert("Please enter a username!");
                return;
            }

            repoList.innerHTML = '<li>Loading repositories...</li>';

            try {
                // Fetch public repositories for the specified user
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                
                if (!response.ok) {
                    throw new Error(response.status === 404 ? 'User not found' : 'API error');
                }
                
                const repos = await response.json();
                repoList.innerHTML = '';

                if (repos.length === 0) {
                    repoList.innerHTML = '<li>No public repositories found for this user.</li>';
                    return;
                }

                // Map through repositories and create HTML cards
                repos.forEach(repo => {
                    const li = document.createElement('li');
                    li.className = 'repo-card';
                    li.innerHTML = `
                        <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                        <p>${repo.description || 'No description provided.'}</p>
                        <div class="repo-stats">
                            <span>⭐ ${repo.stargazers_count}</span> | 
                            <span>🍴 ${repo.forks_count}</span> | 
                            <span>Last updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    `;
                    repoList.appendChild(li);
                });
            } catch (error) {
                repoList.innerHTML = `<li style="color:red;">Error: ${error.message}</li>`;
            }
        }
    </script>
</body>
</html>
