<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nerd Arena | V3 Side Drawer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========================================= */
        /* PASTE YOUR BASE style.css HERE            */
        /* ========================================= */

        /* ========================================= */
        /* V3 OFF-CANVAS DRAWER CSS                  */
        /* ========================================= */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(4px);
            z-index: 1999; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        @media (max-width: 768px) {
            .app-layout { grid-template-columns: 100%; padding: 10px; padding-bottom: 0; }
            
            .sidebar-nav {
                display: flex; flex-direction: column;
                position: fixed; top: 0; left: 0;
                width: 280px; height: 100vh; 
                padding: 20px; padding-bottom: 90px;
                background: var(--bg-color); 
                z-index: 2000;
                box-shadow: 5px 0 25px rgba(0, 0, 0, 0.15);
                transform: translateX(-100%); 
                transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                overflow-y: auto;
            }
            
            .sidebar-nav.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <header class="top-header">
         <a href="home.html"><div class="logo"><i class="ph-fill ph-code"></i> <span>Nerd Arena</span></div></a>
        <div class="search-container">
            <input type="text" placeholder="Search ideas, tech stacks, or nerds...">
        </div>
        <div class="header-actions">
            <button class="icon-btn show-mobile-only" id="mobile-menu-btn"><i class="ri-menu-line"></i></button>
            <button class="icon-btn hide-mobile"><i class="ri-message-3-line"></i></button>
            <button class="icon-btn hide-mobile"><i class="ri-notification-3-line"></i></button>
            
            <div class="user-profile dropdown-container" id="nav-user-container">
                <div class="avatar-text bg-primary" id="nav-avatar">...</div>
            </div>
        </div>
    </header>

    <main class="app-layout">
        <div class="sidebar-overlay" id="mobile-overlay"></div>
        
        <aside class="sidebar-nav" id="mobile-sidebar">
            <ul class="nav-menu">
                <li class="active"><i class="ri-home-5-fill icon"></i> Home</li>
                <li><i class="ri-user-smile-line icon"></i> Profile</li>
            </ul>
            <h4 class="section-title">Favorites</h4>
            <ul class="nav-menu">
                <li><i class="ri-message-3-line icon"></i> Messages</li>
                <li><i class="ri-terminal-box-line icon"></i> Feed</li>
            </ul>
        </aside>

        <section class="main-feed">
            <div class="card create-post animate-fade-in">
                <div class="post-input-wrapper">
                    <div class="avatar-text bg-primary">...</div>
                    <textarea placeholder="Post your idea..." rows="2"></textarea>
                </div>
            </div>
        </section>

        <aside class="sidebar-widgets">
            <div class="card widget animate-fade-in"><h3>🔥 Trending Ideas</h3></div>
        </aside>
    </main>

    <nav class="bottom-nav animate-fade-in">
        <a href="home.html" class="active"><i class="ph-fill ph-terminal-window"></i></a>
        <a href="search.html"><i class="ph ph-magnifying-glass"></i></a>
        <a href="#" class="nav-center-btn"><i class="ph ph-plus"></i></a>
        <a href="#"><i class="ri-notification-3-line"></i></a>
        <a href="profile.html"><i class="ph ph-user"></i></a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('mobile-sidebar');
            const menuBtn = document.getElementById('mobile-menu-btn');
            const overlay = document.getElementById('mobile-overlay');

            if(!sidebar || !menuBtn || !overlay) return;

            const toggleMenu = () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            };

            menuBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        });
    </script>
</body>
</html>
