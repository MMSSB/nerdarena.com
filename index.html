<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nerd Arena | The Idea Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <div class="logo">
            <i class="ph-fill ph-code"></i> <span>Nerd Arena</span>
        </div>
        <div class="search-container">
            <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
            <input type="text" placeholder="Search ideas, tech stacks, or nerds...">
        </div>
        <div class="header-actions">
            <button class="icon-btn show-mobile-only"><i class="ph ph-magnifying-glass"></i></button>
            <button class="icon-btn hide-mobile"><i class="ri-message-3-line"></i></button>
            <button class="icon-btn hide-mobile"><i class="ri-notification-3-line"></i></button>
            
            <div class="user-profile dropdown-container" id="nav-user-container">
                <div class="avatar-text bg-primary" id="nav-avatar">...</div>
                <div class="dropdown-menu" id="nav-dropdown">
                    <a href="profile.html"><i class="ri-user-line"></i> My Profile</a>
                    <a href="settings-account.html"><i class="ri-settings-4-line"></i> Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="logout-btn" class="text-danger"><i class="ri-logout-box-r-line"></i> Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <main class="app-layout">
        <aside class="sidebar-nav">
            <ul class="nav-menu">
                <li class="active"><i class="ph ph-terminal-window icon"></i> Arena Feed</li>
                <li><i class="ph ph-lightbulb icon"></i> My Ideas</li>
                <li><i class="ph ph-rocket-launch icon"></i> Shipped Projects</li>
            </ul>
            <h4 class="section-title">My Workspaces</h4>
            <ul class="nav-menu">
                <li><i class="ri-folder-code-line icon"></i> Coffee200 Web</li>
                <li><i class="ri-server-line icon"></i> Local LLM Wrapper</li>
            </ul>
        </aside>

        <section class="main-feed">
            <div class="card create-post animate-fade-in">
                <div class="post-input-wrapper">
                    <div class="avatar-text bg-primary">...</div>
                    <textarea placeholder="Pitch your idea, architecture, or project roadmap..." rows="2"></textarea>
                </div>
                <div class="post-actions">
                    <div class="action-icons">
                        <span title="Add Code Snippet"><i class="ph ph-code-block"></i></span> 
                        <span title="Format Markdown"><i class="ph ph-text-b"></i></span> 
                    </div>
                    <button class="btn-post">Pitch Idea</button>
                </div>
            </div>
            </section>

        <aside class="sidebar-widgets">
            <div class="card widget animate-fade-in">
                <h3>🔥 Trending Ideas</h3>
                <ul class="trending-list">
                    <li><div class="trend-info"><strong>Local LLM wrapper in Electron</strong><span>1,204 upvotes</span></div></li>
                </ul>
            </div>
        </aside>
    </main>

    <nav class="bottom-nav animate-fade-in">
        <a href="index.html" class="active"><i class="ph-fill ph-terminal-window"></i></a>
        <a href="#"><i class="ph ph-magnifying-glass"></i></a>
        <a href="#" class="nav-center-btn" onclick="document.querySelector('.create-post textarea').focus();"><i class="ph-fill ph-plus"></i></a>
        <a href="#"><i class="ri-notification-3-line"></i></a>
        <a href="profile.html"><i class="ph ph-user"></i></a>
    </nav>

    <script type="module" src="pload.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
